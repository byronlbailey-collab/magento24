<div style="display: flex; align-items: center; gap: 8px;">
    <span class="amerimark-color-dot"
          style="width: 24px; height: 24px; flex: 0 0 auto; border-radius: 50%; border: 2px solid #adadad;"
          data-bind="visible: hex, style: {backgroundColor: hex() || 'transparent', backgroundImage: image() || 'none'}"></span>
    <select class="admin__control-select" data-bind="
        attr: {
            name: inputName,
            id: uid,
            disabled: disabled,
            'aria-describedby': noticeId,
            'aria-label': 'Color'
        },
        hasFocus: focused,
        optgroup: options,
        value: value,
        optionsCaption: caption,
        optionsValue: 'value',
        optionsText: 'label'"></select>
</div>
